<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2"><meta name="description" content="Explore the dual construction of free nilpotent minimum algebras over finite bounded distributive lattices."><title>Free NM algebras dually</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="highlight-definitions" width="0" height="0" aria-hidden="true" focusable="false"><defs><clipPath id="nm-highlight-left" clipPathUnits="userSpaceOnUse"><rect x="-200000" y="-200000" width="200000" height="400000"/></clipPath><clipPath id="nm-highlight-right" clipPathUnits="userSpaceOnUse"><rect x="0" y="-200000" width="200000" height="400000"/></clipPath></defs></svg>
<header class="topbar"><a class="brand" href="./"><span aria-hidden="true" class="brand-mark">NM</span>Free NM algebras dually</a><div class="file-actions"><span id="saved" role="status">Saved on this device</span><button id="open">Open</button><button id="save" class="dark">Save file</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<main>
  <div class="document-bar"><div class="document-tools"><label for="examples">Example</label><select id="examples"><option value="">Choose…</option><option value="boolean2">Powerset · 2 atoms</option><option value="boolean3">Powerset · 3 atoms</option><option value="chain2">Chain · 2 points</option><option value="chain3">Chain · 3 points</option><option value="chain">Chain · 4 points</option><option value="chain5">Chain · 5 points</option><option value="antichain">Antichain · 4 points</option></select><button id="blank">+ Blank</button><button id="undo" aria-label="Undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">↷</button><button id="clear-selection" disabled>Clear selection</button></div></div>
  <div class="panel-visibility" role="group" aria-label="Visible diagrams"><span>Show</span><label><input id="show-pairs" type="checkbox" checked aria-controls="pairs-panel"> Second panel</label><label><input id="show-output" type="checkbox" checked aria-controls="output-panel"> Third panel</label></div>
  <div id="workspace" class="workspace">
    <section class="panel input-panel" aria-label="Input poset">
      <div class="panel-heading"><div><h1>Input <span class="math">X</span></h1><span id="input-count" class="count"></span></div><div class="panel-actions"><button id="delete-poset" class="delete">Delete poset</button><button id="arrange">Arrange</button></div></div>
      <div class="panel-tools"><div class="tools" role="toolbar" aria-label="Drawing tools"><button data-tool="move" aria-pressed="true" title="Move (V)">Move <kbd>V</kbd></button><button data-tool="point" aria-pressed="false" title="Point (N)">+ Point <kbd>N</kbd></button><button data-tool="order" aria-pressed="false" title="Order (E)">Order <kbd>E</kbd></button></div></div>
      <div class="canvas-wrap"><svg id="input-canvas" viewBox="0 0 500 500" role="group" aria-label="Editable input Hasse diagram"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce2d8"/></pattern></defs><rect class="canvas-bg" x="-200000" y="-200000" width="400000" height="400000" fill="url(#grid)"/><g class="edges"></g><g class="point-backs" aria-hidden="true"></g><g class="points"></g><g id="order-preview" pointer-events="none"></g></svg><div id="input-empty" class="empty" hidden><button id="add-first">+ Add a point</button></div></div>
      <div class="canvas-controls"><label><input id="snap" type="checkbox"> Snap</label><label><input id="input-labels" type="checkbox" checked> Labels</label><div class="zoom" aria-label="Input zoom"><button data-zoom="input:out" aria-label="Zoom input out">−</button><button data-fit="input">Fit</button><button data-zoom="input:in" aria-label="Zoom input in">+</button></div><button data-export="input" title="Save input diagram as PNG">PNG</button></div>
    </section>
    <section id="pairs-panel" class="panel pairs-panel" aria-label="Comparable pair poset">
      <div class="panel-heading"><div><h2 class="formula"><span class="math-term">(<math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>X</mi><mo>≤</mo></msup></math>, <math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>X</mi><mo>=</mo></msup></math>)</span></h2><span id="pairs-count" class="element-count" aria-live="polite"></span></div></div>
      <div class="panel-tools construction-note" aria-hidden="true"></div>
      <div class="canvas-wrap"><svg id="pairs-canvas" viewBox="0 0 500 500" role="group" aria-label="Hasse diagram of comparable pairs"><rect class="canvas-bg" x="-200000" y="-200000" width="400000" height="400000" fill="#fafbf7"/><g class="edges"></g><g class="point-backs" aria-hidden="true"></g><g class="points"></g></svg><div id="pairs-notice" class="empty" hidden><p id="pairs-message"></p></div></div>
      <div class="canvas-controls"><label><input id="pair-labels" type="checkbox"> Pair labels</label><div class="zoom" aria-label="Pair poset zoom"><button data-zoom="pairs:out" aria-label="Zoom pairs out">−</button><button data-fit="pairs">Fit</button><button data-zoom="pairs:in" aria-label="Zoom pairs in">+</button></div><button data-export="pairs" title="Save pair diagram as PNG">PNG</button></div>
    </section>
    <section id="output-panel" class="panel output-panel" aria-label="Chain poset">
      <div class="panel-heading output-heading"><div class="output-title"><h2 id="output-title" class="formula" aria-live="polite"></h2><span id="output-count" class="element-count" aria-live="polite"></span></div><div class="parameters" role="group" aria-label="Chain size parameters">
    <div class="parameter-control"><label for="parameter-m"><span class="math">m</span></label><input id="parameter-m" type="text" min="0" step="1" value="All" disabled aria-label="m: maximum size of any chain"><label class="parameter-all"><input id="all-m" type="checkbox" checked> All</label></div>
    <div class="parameter-control"><label for="parameter-n"><span class="math">n</span></label><input id="parameter-n" type="text" min="0" step="1" value="All" disabled aria-label="n: maximum size of a chain containing a diagonal pair"><label class="parameter-all"><input id="all-n" type="checkbox" checked> All</label></div>
  </div></div>
      <div class="panel-tools construction-note" aria-hidden="true"></div>
      <div class="canvas-wrap"><svg id="output-canvas" viewBox="0 0 700 500" role="group" aria-label="Root system of nonempty chains of comparable pairs"><rect class="canvas-bg" x="-200000" y="-200000" width="400000" height="400000" fill="#fafbf7"/><g class="edges"></g><g class="point-backs" aria-hidden="true"></g><g class="points"></g></svg><div id="output-notice" class="empty" hidden><p id="output-message"></p></div></div>
      <div class="canvas-controls"><label><input id="chain-labels" type="checkbox"> Chain labels</label><div class="zoom" aria-label="Chain poset zoom"><button data-zoom="output:out" aria-label="Zoom chains out">−</button><button data-fit="output">Fit</button><button data-zoom="output:in" aria-label="Zoom chains in">+</button></div><button data-export="output" title="Save chain diagram as PNG">PNG</button></div>
    </section>
  </div>
  <div class="statusbar"><span id="status" role="status" aria-live="polite">Drag points to move. Hover to inspect; click to pin.</span><span>Higher means greater · Drag empty space to pan</span></div>
  <div class="details-row"><section class="inspector"><div class="section-heading"><h2>Inspector</h2><button id="delete" class="delete" disabled>Delete selection</button></div><div id="inspector-content"><p>Hover or select a point.</p></div></section><section class="legend"><div class="section-heading"><h2>Base hues</h2><span id="hue-count" class="count"></span></div><div id="hue-list"></div><p class="diagonal-key"><span aria-hidden="true" class="diagonal-swatch"></span>Yellow circles mark X<sup>=</sup> and chains contained in X<sup>=</sup>.</p></section></div>
</main>
<script type="module" src="app.mjs"></script>
</body></html>
